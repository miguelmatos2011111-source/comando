<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eef0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Comando</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
  :root {
    --ink: #0f172a; --ink2: #475569;
    --glass: rgba(255,255,255,.6); --glass-b: rgba(255,255,255,.9);
    --shadow: 0 10px 30px rgba(15,23,42,.12);
    --accent: #6366f1; --red: #ef4444; --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Outfit", "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(420px 380px at 0% 0%, rgba(125,211,252,.7), transparent 70%),
      radial-gradient(420px 380px at 100% 20%, rgba(255,179,217,.6), transparent 70%),
      radial-gradient(500px 420px at 50% 100%, rgba(165,180,252,.8), transparent 70%),
      #f3f1ff;
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; touch-action: manipulation; }
  .glass { background: var(--glass); border: 1.5px solid var(--glass-b); box-shadow: var(--shadow); }
  .btn { display: flex; align-items: center; justify-content: center; transition: transform .12s, background .12s; }
  .btn:active { transform: scale(.92); background: rgba(255,255,255,.95); }
  svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* topo */
  header { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 26px; font-weight: 600; }
  #status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); margin-top: 2px; }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; }
  #status.on .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(34,197,94,.2); }
  #status.wait .dot { background: #f59e0b; }
  .icon-btn { width: 48px; height: 48px; border-radius: 16px; }

  /* linha de topo */
  .top-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .top-row .btn { height: 64px; border-radius: 20px; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; }
  .primary-btn { background: var(--ink) !important; color: #fff; border-color: var(--ink) !important; }
  .primary-btn:active { background: #1e293b !important; }

  /* direcional */
  .dpad-wrap { display: flex; justify-content: center; padding: 6px 0 0; }
  .dpad { position: relative; width: 270px; height: 270px; border-radius: 50%; }
  .dpad .dir { position: absolute; width: 80px; height: 80px; border-radius: 50%; color: var(--ink2); }
  .dpad .up { left: 95px; top: 6px; } .dpad .down { left: 95px; bottom: 6px; }
  .dpad .left { left: 6px; top: 95px; } .dpad .right { right: 6px; top: 95px; }
  .dpad .ok {
    position: absolute; left: 75px; top: 75px; width: 120px; height: 120px; border-radius: 50%;
    background: var(--ink); color: #fff; font-size: 22px; font-weight: 600;
    box-shadow: 0 12px 28px rgba(15,23,42,.35);
  }
  .dpad .ok:active { background: #1e293b; }
  .dpad svg { width: 30px; height: 30px; }
  .hint { text-align: center; font-size: 12px; color: var(--ink2); margin-top: -8px; }

  .nav-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .nav-row .btn { height: 56px; border-radius: 18px; gap: 8px; font-size: 15px; font-weight: 500; }

  /* volume / canais */
  .rockers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rocker { border-radius: 26px; display: grid; grid-template-rows: 60px 44px 60px; overflow: hidden; }
  .rocker .btn { font-size: 26px; font-weight: 400; }
  .rocker .mid { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: var(--ink2); gap: 6px; }
  .rocker .mid svg { width: 18px; height: 18px; }

  /* apps */
  h2 { font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; }
  h2 button { font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--accent); font-weight: 500; }
  #apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; margin-top: 12px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; text-align: center; }
  .app .ic {
    width: 62px; height: 62px; border-radius: 18px; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600;
    background: linear-gradient(150deg, var(--c2), var(--c));
    box-shadow: 0 8px 18px rgba(15,23,42,.18);
    transition: transform .12s;
  }
  .app:active .ic { transform: scale(.9); }
  .app span:last-child { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* teclado numérico */
  #srcpad { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #srcpad.show { display: grid; }
  #srcpad .btn { height: 54px; border-radius: 16px; font-size: 17px; font-weight: 500; }
  #numpad { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #numpad.show { display: grid; }
  #numpad .btn { height: 54px; border-radius: 16px; font-size: 22px; }
  #numpad .typed { grid-column: 1 / -1; text-align: center; font-size: 15px; color: var(--ink2); min-height: 20px; }

  /* folha de ligação */
  #sheet-bg { position: fixed; inset: 0; background: rgba(15,23,42,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 480px; margin: 0 auto;
    background: #fff; border-radius: 28px 28px 0 0;
    padding: 24px 20px max(24px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease;
    display: flex; flex-direction: column; gap: 14px;
  }
  body.sheet #sheet { transform: none; }
  body.sheet #sheet-bg { opacity: 1; pointer-events: auto; }
  #sheet h3 { font-size: 22px; font-weight: 600; }
  #sheet p { font-size: 14px; color: var(--ink2); line-height: 1.45; }
  #sheet label { font-size: 13px; font-weight: 600; color: var(--ink2); }
  #code {
    width: 100%; height: 56px; border-radius: 14px; border: 1.5px solid #cbd5e1;
    padding: 0 16px; font: inherit; font-size: 22px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink); outline: none; margin-top: 6px; text-align: center;
  }
  #code:focus { border-color: var(--accent); }
  .primary { height: 52px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; }
  .secondary { height: 48px; border-radius: 14px; background: #eef2ff; color: var(--accent); font-size: 15px; font-weight: 500; }

  #toast {
    position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); z-index: 20;
    transform: translateX(-50%) translateY(-120%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 24px; font-size: 14px;
    transition: transform .25s; max-width: 90vw; text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Comando</h1>
      <div id="status"><span class="dot"></span><span id="status-txt">Sem ligação</span></div>
    </div>
    <button class="btn glass icon-btn" id="open-settings" aria-label="Ligação">
      <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
    </button>
  </header>

  <div class="top-row">
    <button class="btn glass primary-btn" data-cmd='{"a":"home"}'>
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início
    </button>
    <button class="btn glass" id="src-toggle">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Fonte
    </button>
    <button class="btn glass" data-cmd='{"a":"app","id":"org.tizen.menu","n":"Definições"}'>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Definições
    </button>
    <button class="btn glass" id="numpad-toggle">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.2"/><circle cx="12" cy="6" r="1.2"/><circle cx="18" cy="6" r="1.2"/><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/><circle cx="6" cy="18" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="18" cy="18" r="1.2"/></svg>Canal
    </button>
  </div>

  <div id="srcpad">
    <button class="btn glass" data-cmd='{"a":"src","t":"HDMI","n":1}'>HDMI 1</button>
    <button class="btn glass" data-cmd='{"a":"src","t":"HDMI","n":2}'>HDMI 2</button>
    <button class="btn glass" data-cmd='{"a":"app","id":"org.tizen.tv-viewer","n":"TV"}'>TV</button>
  </div>

  <div id="numpad"></div>

  <div class="dpad-wrap">
    <div class="dpad glass">
      <button class="btn dir up" data-cmd='{"a":"key","k":"UP"}' data-repeat><svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg></button>
      <button class="btn dir down" data-cmd='{"a":"key","k":"DOWN"}' data-repeat><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      <button class="btn dir left" data-cmd='{"a":"key","k":"LEFT"}' data-repeat><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button>
      <button class="btn dir right" data-cmd='{"a":"key","k":"RIGHT"}' data-repeat><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
      <button class="btn ok" data-cmd='{"a":"key","k":"ENTER"}'>OK</button>
    </div>
  </div>
  <p class="hint">As setas e o OK mexem no ecrã do Home.</p>

  <div class="nav-row">
    <button class="btn glass" data-cmd='{"a":"key","k":"BACK"}'>
      <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>Voltar
    </button>
    <button class="btn glass" data-cmd='{"a":"app","id":"org.tizen.tv-viewer","n":"TV"}'>
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>TV
    </button>
    <button class="btn glass" data-cmd='{"a":"app","id":"org.tizen.browser","n":"Internet"}'>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Internet
    </button>
  </div>

  <div class="rockers">
    <div class="rocker glass">
      <button class="btn" data-cmd='{"a":"vol","d":"up"}' data-repeat>+</button>
      <button class="btn mid" data-cmd='{"a":"vol","d":"mute"}'>
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>VOL
      </button>
      <button class="btn" data-cmd='{"a":"vol","d":"down"}' data-repeat>−</button>
    </div>
    <div class="rocker glass">
      <button class="btn" data-cmd='{"a":"ch","d":"up"}'>+</button>
      <button class="btn mid" data-cmd='{"a":"app","id":"org.tizen.tv-viewer","n":"TV"}'>
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/></svg>CANAIS
      </button>
      <button class="btn" data-cmd='{"a":"ch","d":"down"}'>−</button>
    </div>
  </div>

  <section>
    <h2>Apps <button id="load-apps">Ver todas as apps da TV</button></h2>
    <div id="apps"></div>
  </section>
</div>

<!-- Folha de ligação -->
<div id="sheet-bg"></div>
<div id="sheet">
  <h3>Ligar à TV</h3>
  <p>Escreve o <b>código do comando</b> que aparece no canto superior direito do Home, na TV.
     Só precisas de fazer isto uma vez.</p>
  <div>
    <label for="code">Código</label>
    <input id="code" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="11">
  </div>
  <button class="primary" id="connect">Ligar</button>
  <button class="secondary" id="close-settings">Fechar</button>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== Configuração =====
  // As ordens passam pelo servidor MQTT público da HiveMQ, num canal com o código secreto da TV.
  var BROKER = "broker.hivemq.com", PORT = 8884, PATH = "/mqtt";
  var DEFAULT_APPS = [
    { name: "YouTube",     appId: "com.samsung.tv.cobalt-yt", color: "#e62117", glyph: "▶" },
    { name: "Netflix",     appId: "org.tizen.netflix-app",    color: "#b20710", glyph: "N" },
    { name: "Prime Video", appId: "org.tizen.primevideo",     color: "#0f79af", glyph: "P" },
    { name: "Disney+",     appId: "MCmYXNxgcu.DisneyPlus",    color: "#113ccf", glyph: "D+" },
    { name: "Spotify",     appId: "rJeHak5zRg.Spotify",       color: "#1db954", glyph: "♪" },
    { name: "Internet",    appId: "org.tizen.browser",        color: "#5b5f97", glyph: "◎" }
  ];
  var PALETTE = ["#6366f1", "#0ea5e9", "#10b981", "#f59e0b", "#ef4444", "#ec4899", "#8b5cf6", "#14b8a6"];

  // ===== Armazenamento local (só neste telemóvel) =====
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var code = load("tv-code") || "";
  var client = null, mqttUp = false, tvSeen = false, pingTimer = null;

  // ===== UI helpers =====
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }
  function setStatus(state, txt) {
    document.getElementById("status").className = state;
    document.getElementById("status-txt").textContent = txt;
  }
  function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
  function lighten(hex, amt) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return "rgb(" + Math.round(r + (255 - r) * amt) + "," + Math.round(g + (255 - g) * amt) + "," + Math.round(b + (255 - b) * amt) + ")";
  }

  // ===== Ligação (MQTT) =====
  function topic(kind) { return "hometv/" + code + "/" + kind; }

  function connect() {
    if (!code) { openSheet(); return; }
    if (typeof Paho === "undefined") { setStatus("", "Sem internet"); return; }
    try { if (client && client.isConnected()) client.disconnect(); } catch (e) {}
    mqttUp = false; tvSeen = false;
    setStatus("wait", "A ligar…");
    var c = new Paho.MQTT.Client(BROKER, PORT, PATH, "phone-" + Math.floor(Math.random() * 1e9));
    client = c;
    c.onMessageArrived = function (msg) {
      var m; try { m = JSON.parse(msg.payloadString); } catch (e) { return; }
      if (m.a === "pong") {
        if (!tvSeen) toast("Ligado à TV");
        tvSeen = true;
        setStatus("on", "Ligado à TV");
        closeSheet();
      } else if (m.a === "apps") {
        showInstalledApps(m.list || []);
      } else if (m.a === "vol") {
        toast(m.m ? "Som desligado" : (m.v != null ? "Volume " + m.v : "Volume"));
      } else if (m.a === "err") {
        toast("Erro na TV (" + m.c + "): " + m.m);
      }
    };
    c.onConnectionLost = function () {
      if (client !== c) return;
      mqttUp = false;
      setStatus("wait", "A voltar a ligar…");
      setTimeout(function () { if (client === c) connect(); }, 2000);
    };
    c.connect({
      useSSL: true, keepAliveInterval: 30, timeout: 10,
      onSuccess: function () {
        if (client !== c) return;
        mqttUp = true;
        c.subscribe(topic("state"));
        ping();
      },
      onFailure: function () {
        if (client !== c) return;
        setStatus("", "Não consegui ligar ao servidor");
        setTimeout(function () { if (client === c) connect(); }, 4000);
      }
    });
  }

  function ping() {
    publish({ a: "ping" }, true);
    clearTimeout(pingTimer);
    pingTimer = setTimeout(function () {
      if (!tvSeen) setStatus("wait", "À espera da TV… (o Home está aberto?)");
    }, 4000);
  }

  function publish(obj, silent) {
    if (!mqttUp || !client) { if (!silent) toast(code ? "Sem ligação" : "Primeiro liga à TV"); if (!code) openSheet(); return false; }
    var m = new Paho.MQTT.Message(JSON.stringify(obj));
    m.destinationName = topic("cmd");
    client.send(m);
    return true;
  }

  function send(cmd) {
    buzz();
    if (publish(cmd) && cmd.a === "app") toast("A abrir " + (cmd.n || cmd.id));
  }

  // ===== Botões =====
  document.querySelectorAll("[data-cmd]").forEach(function (b) {
    var cmd = JSON.parse(b.getAttribute("data-cmd")), repeat = b.hasAttribute("data-repeat");
    var timer = null, delay = null;
    function stop() { clearTimeout(delay); clearInterval(timer); timer = delay = null; }
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      send(cmd);
      if (repeat) delay = setTimeout(function () { timer = setInterval(function () { send(cmd); }, 160); }, 450);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, stop); });
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });

  // teclado numérico: junta os algarismos e muda de canal ao fim de 1,5 s
  var np = document.getElementById("numpad"), typed = "", typedTimer = null;
  var typedEl = document.createElement("div");
  typedEl.className = "typed";
  np.appendChild(typedEl);
  ["1","2","3","4","5","6","7","8","9","","0",""].forEach(function (n) {
    var b = document.createElement("button");
    if (n) {
      b.className = "btn glass"; b.textContent = n;
      b.addEventListener("click", function () {
        buzz();
        typed += n; typedEl.textContent = "Canal " + typed;
        clearTimeout(typedTimer);
        typedTimer = setTimeout(function () {
          publish({ a: "ch", n: typed });
          typed = ""; typedEl.textContent = "";
        }, 1500);
      });
    }
    np.appendChild(b);
  });
  document.getElementById("numpad-toggle").addEventListener("click", function () { np.classList.toggle("show"); });
  document.getElementById("src-toggle").addEventListener("click", function () {
    document.getElementById("srcpad").classList.toggle("show");
  });

  // ===== Apps =====
  function renderApps(list) {
    var box = document.getElementById("apps");
    box.innerHTML = "";
    list.forEach(function (a, i) {
      var color = a.color || PALETTE[i % PALETTE.length];
      var b = document.createElement("button");
      b.className = "app";
      b.innerHTML = '<span class="ic"></span><span></span>';
      var ic = b.querySelector(".ic");
      ic.style.setProperty("--c", color);
      ic.style.setProperty("--c2", lighten(color, .35));
      ic.textContent = a.glyph || (a.name || "?").charAt(0).toUpperCase();
      b.lastChild.textContent = a.name;
      b.addEventListener("click", function () { send({ a: "app", id: a.appId, n: a.name }); });
      box.appendChild(b);
    });
  }
  function showInstalledApps(list) {
    if (!list.length) { toast("A TV não devolveu a lista de apps"); return; }
    var known = {};
    DEFAULT_APPS.forEach(function (a) { known[a.appId] = a; });
    renderApps(list.map(function (a) {
      return known[a.id] || { name: a.n, appId: a.id };
    }).sort(function (x, y) { return x.name.localeCompare(y.name); }));
    toast(list.length + " apps encontradas");
  }
  document.getElementById("load-apps").addEventListener("click", function () { send({ a: "apps" }); });
  renderApps(DEFAULT_APPS);

  // ===== Folha de ligação =====
  function pretty(c) { return c ? c.slice(0, 5) + "-" + c.slice(5) : ""; }
  function openSheet() { document.getElementById("code").value = pretty(code); document.body.classList.add("sheet"); }
  function closeSheet() { document.body.classList.remove("sheet"); }
  document.getElementById("open-settings").addEventListener("click", openSheet);
  document.getElementById("close-settings").addEventListener("click", closeSheet);
  document.getElementById("sheet-bg").addEventListener("click", closeSheet);
  document.getElementById("connect").addEventListener("click", function () {
    var v = document.getElementById("code").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (v.length !== 10) { toast("O código tem 10 letras/números"); return; }
    code = v; save("tv-code", code);
    connect();
  });

  // o link pode trazer o código: .../comando/#ABCDE12345
  var fromHash = location.hash.replace("#", "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (fromHash.length === 10) { code = fromHash; save("tv-code", code); history.replaceState(null, "", location.pathname); }

  if (code) connect(); else setTimeout(openSheet, 400);

  // ao voltar à app, confirma que a TV está lá
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !code) return;
    if (!client || !mqttUp) connect(); else ping();
  });
})();
</script>
</body>
</html>
